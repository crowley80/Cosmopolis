name: Athun storage tests

on:
  push:
    branches:
      - main
      - feat/athun-multisave-world
  pull_request:
    branches:
      - main

jobs:
  storage-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test storage and shared world
        run: node --test tests/storage.test.js
