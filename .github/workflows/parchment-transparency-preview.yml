name: Parchment transparency preview
on:
  push:
    branches: [work/athun-papiro-universal-20261122]
    paths: ['.github/workflows/parchment-transparency-preview.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save sharp
      - name: Create isolated transparency experiment
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          (async () => {
            const src = 'app/assets/athun-papiro-universal.webp';
            const { data, info } = await sharp(src).ensureAlpha().raw().toBuffer({ resolveWithObject: true });
            const { width:w, height:h, channels:c } = info;
            const seen = new Uint8Array(w*h);
            const queue = new Int32Array(w*h);
            let head=0, tail=0, removed=0;
            const eligible = i => {
              const p=i*c, r=data[p], g=data[p+1], b=data[p+2];
              return Math.max(r,g,b) <= 43 && (Math.max(r,g,b)-Math.min(r,g,b)) <= 24;
            };
            const add = i => { if (!seen[i] && eligible(i)) { seen[i]=1; queue[tail++]=i; } };
            for(let x=0;x<w;x++){ add(x); add((h-1)*w+x); }
            for(let y=0;y<h;y++){ add(y*w); add(y*w+w-1); }
            while(head<tail){
              const i=queue[head++], x=i%w, y=(i/w)|0, p=i*c;
              data[p+3]=0; removed++;
              if(x) add(i-1); if(x+1<w) add(i+1); if(y) add(i-w); if(y+1<h) add(i+w);
            }
            await sharp(data,{raw:{width:w,height:h,channels:c}}).png().toFile('artifacts/athun-papiro-transparencia-prueba.png');
            // Composite on neutral backgrounds to inspect edge preservation without altering the source.
            for (const [name,color] of [['claro','#e8dfcf'],['gris','#777777'],['oscuro','#252525']]) {
              await sharp({create:{width:w,height:h,channels:3,background:color}}).composite([{input:'artifacts/athun-papiro-transparencia-prueba.png'}]).png().toFile('artifacts/athun-papiro-preview-'+name+'.png');
            }
            fs.writeFileSync('artifacts/diagnostico.txt', JSON.stringify({width:w,height:h,channels:c,borderPixelsRemoved:removed,percent:(removed/(w*h)*100).toFixed(2)},null,2));
            console.log(fs.readFileSync('artifacts/diagnostico.txt','utf8'));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: parchment-transparency-test
          path: artifacts/
          retention-days: 3
