name: Visual preview
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'index.html'
      - '.github/workflows/visual-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/cosmopolis-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cosmopolis-http.log
          exit 1
      - name: Render adventure on mobile and desktop
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const character = {
              name: 'Ariadna',
              nature: 'Humana',
              appearance: 'Viajera de cabello oscuro y ojos atentos.',
              history: 'Cartógrafa en busca de lugares olvidados.',
              abilities: 'Observación y orientación.',
              personality: 'Curiosa y prudente.'
            };
            const adventure = {
              id: 'preview',
              title: 'La campana bajo la montaña',
              location: 'Valdebruma',
              text: 'El camino desciende entre montañas cubiertas de niebla. Al final aparece Valdebruma, un pueblo de tejados oscuros, chimeneas humeantes y calles empedradas.\n\nAriadna, llevas poco tiempo en el pueblo cuando escuchas una campanada. Es profunda, lenta y parece subir desde debajo de tus pies.\n\nLa gente se detiene. Nadie mira hacia el campanario de la plaza. Todos miran hacia el viejo pozo de piedra, cerrado con una losa y varias cadenas oxidadas.\n\nUna mujer se abre paso entre los vecinos. Lleva un tubo de mapas colgado al hombro y tiene barro hasta las rodillas.\n\n—Me llamo Elia. Soy cartógrafa —dice, sin apartar los ojos del pozo—. Esa campana lleva treinta años sin existir. Y, sin embargo, acaba de sonar por tercera vez esta semana.\n\nSe vuelve hacia ti.\n\n—No te conozco, pero pareces alguien capaz de escuchar antes de salir corriendo. Necesito ayuda.\n\nElia espera tu respuesta.',
              state: { currentLocation: 'Plaza del pozo', time: 'Mañana', characters: { Elia: { role: 'Cartógrafa', location: 'Plaza del pozo', attitude: 'Cautelosa', trust: 0 } } },
              createdAt: new Date().toISOString()
            };
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1, isMobile: true, hasTouch: true });
            await context.addInitScript(({ character, adventure }) => {
              localStorage.setItem('cosmopolis_save', JSON.stringify({ character, adventure, actions: [], world: { events: [], facts: [], relationships: {} } }));
            }, { character, adventure });
            const page = await context.newPage();
            page.on('pageerror', error => console.error('PAGE ERROR:', error.message));
            await page.goto('http://127.0.0.1:8080/index.html', { waitUntil: 'networkidle' });
            await page.locator('.adventure-screen').waitFor();
            await page.screenshot({ path: 'artifacts/cosmopolis-mobile.png', fullPage: true });

            // Prueba de interacción: los cuatro paneles y las ayudas de exploración.
            const assert = require('node:assert/strict');
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            let narrativeCall = 0;
            await page.route('http://127.0.0.1:8081/**', async route => {
              const request = route.request();
              const headers = {
                'Access-Control-Allow-Origin': 'http://127.0.0.1:8080',
                'Access-Control-Allow-Methods': 'GET, POST, OPTIONS',
                'Access-Control-Allow-Headers': 'Content-Type'
              };
              if (request.method() === 'OPTIONS') {
                await route.fulfill({ status: 204, headers });
              } else if (request.url().endsWith('/health')) {
                await route.fulfill({ status: 200, headers: { ...headers, 'Content-Type': 'application/json' }, body: JSON.stringify({ status: 'ok' }) });
              } else {
                const result = narrativeCall++ === 0 ? {
                  reply: 'La observación revela una pequeña marca de cobre entre las piedras.',
                  event: 'Ariadna ha encontrado un medallón de cobre junto al pozo.',
                  category: 'investigation',
                  location: 'Plaza del pozo',
                  factsToAdd: ['Hay una marca reciente entre las piedras.'],
                  cluesToAdd: ['Un medallón de cobre estaba junto al pozo.'],
                  eliaTrustDelta: 0,
                  itemsToAdd: ['Medallón de cobre'],
                  itemsToRemove: [],
                  charactersToAdd: [{ name: 'Tomás', role: 'Vecino', location: 'Plaza del pozo', attitude: 'Desconfiado', memory: 'Tomás vio a Ariadna encontrar el medallón.' }],
                  characterMemoriesToAdd: [{ character: 'Elia', memory: 'Ariadna encontró un medallón de cobre junto al pozo.' }],
                  time: 'Media mañana',
                  day: 1
                } : {
                  reply: 'Entregas el medallón a Elia. Ella lo guarda con cuidado en su tubo de mapas.',
                  event: 'Ariadna ha entregado el medallón de cobre a Elia.',
                  category: 'offer',
                  location: 'Plaza del pozo',
                  factsToAdd: ['Elia ha recibido el medallón de cobre.'],
                  cluesToAdd: [],
                  eliaTrustDelta: 1,
                  itemsToAdd: [],
                  itemsToRemove: ['Medallón de cobre'],
                  charactersToAdd: [],
                  characterMemoriesToAdd: [
                    { character: 'Elia', memory: 'Ariadna le entregó el medallón de cobre.' },
                    { character: 'Tomás', memory: 'Tomás vio a Ariadna entregar el medallón a Elia.' }
                  ],
                  time: 'Mediodía',
                  day: 1
                };
                await route.fulfill({
                  status: 200,
                  headers: { ...headers, 'Content-Type': 'application/json' },
                  body: JSON.stringify({ choices: [{ message: { content: JSON.stringify(result) } }] })
                });
              }
            });

            await page.locator('#openHistory').click();
            await page.locator('#toolOverlay').getByText('Crónica de tus decisiones').waitFor();
            await page.locator('#closeToolPanel').click();

            await page.locator('#openMap').click();
            await page.locator('#toolOverlay').getByText('Plaza del pozo').waitFor();
            await page.locator('#closeToolPanel').click();

            await page.locator('#openInventory').click();
            await page.locator('#toolOverlay').getByText('Tu inventario está vacío por ahora.').waitFor();
            await page.locator('#closeToolPanel').click();

            await page.locator('#openOptions').click();
            await page.locator('#saveNow').click();
            await page.locator('#toolFeedback').getByText('La partida se ha guardado correctamente.').waitFor();
            await page.locator('#closeToolPanel').click();

            await page.locator('#openExplore').click();
            await page.locator('[data-explore-index="0"]').click();
            await page.locator('#storyContent .current-action').waitFor();
            await page.waitForFunction(() => {
              const raw = localStorage.getItem('cosmopolis_save');
              if (!raw) return false;
              const data = JSON.parse(raw);
              return data.actions && data.actions.length === 1 &&
                data.adventure.state.inventory.includes('Medallón de cobre') &&
                data.adventure.state.visitedLocations.includes('Plaza del pozo');
            });
            assert.equal(pageErrors.length, 0, 'No deben producirse errores JavaScript: ' + pageErrors.join('; '));
            await page.locator('#openInventory').click();
            await page.locator('#toolOverlay').getByText('Medallón de cobre').waitFor();
            await page.locator('#closeToolPanel').click();

            await page.locator('#playerAction').fill('Entrego el medallón de cobre a Elia.');
            await page.locator('#actionForm button[type="submit"]').click();
            await page.waitForFunction(() => {
              const raw = localStorage.getItem('cosmopolis_save');
              if (!raw) return false;
              const data = JSON.parse(raw);
              return data.actions && data.actions.length === 2 &&
                !data.adventure.state.inventory.includes('Medallón de cobre') &&
                data.adventure.state.characters.Elia.trust === 1 &&
                data.adventure.state.characters.Elia.memories.includes('Ariadna encontró un medallón de cobre junto al pozo.') &&
                data.adventure.state.characters.Elia.memories.includes('Ariadna le entregó el medallón de cobre.') &&
                data.adventure.state.characters.Tomás.memories.includes('Tomás vio a Ariadna entregar el medallón a Elia.') &&
                data.adventure.state.time === 'Mediodía' && data.adventure.state.day === 1;
            });
            await page.reload({ waitUntil: 'networkidle' });
            await page.locator('#storyContent .current-action').getByText('Entrego el medallón de cobre a Elia.').waitFor();
            await page.locator('.manuscript-meta').getByText('Momento: Mediodía').waitFor();
            await page.locator('#openInventory').click();
            await page.locator('#toolOverlay').getByText('Tu inventario está vacío por ahora.').waitFor();
            await page.locator('#closeToolPanel').click();
            await page.locator('#openHistory').click();
            await page.locator('#toolOverlay').getByText('Ariadna ha entregado el medallón de cobre a Elia.').waitFor();
            await page.locator('#closeToolPanel').click();

            console.log('INTERACTION_TESTS_OK: history, map, inventory add/remove, options, exploration, AI response, save and reload');

            const mobile = await page.evaluate(() => ({
              viewport: { width: innerWidth, height: innerHeight },
              document: { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight },
              paper: (() => { const r = document.querySelector('.adventure-screen').getBoundingClientRect(); return { x:r.x,y:r.y,width:r.width,height:r.height }; })(),
              header: (() => { const r = document.querySelector('.manuscript-header').getBoundingClientRect(); return { x:r.x,y:r.y,width:r.width,height:r.height }; })(),
              story: (() => { const r = document.querySelector('.story-panel').getBoundingClientRect(); return { x:r.x,y:r.y,width:r.width,height:r.height }; })(),
              player: (() => { const r = document.querySelector('.player-panel').getBoundingClientRect(); return { x:r.x,y:r.y,width:r.width,height:r.height }; })(),
              toolbar: (() => { const r = document.querySelector('.manuscript-toolbar').getBoundingClientRect(); return { x:r.x,y:r.y,width:r.width,height:r.height }; })()
            }));
            console.log('MOBILE_LAYOUT', JSON.stringify(mobile));
            await context.close();
            const desktop = await browser.newContext({ viewport: { width: 1024, height: 900 }, deviceScaleFactor: 1 });
            await desktop.addInitScript(({ character, adventure }) => {
              localStorage.setItem('cosmopolis_save', JSON.stringify({ character, adventure, actions: [], world: { events: [], facts: [], relationships: {} } }));
            }, { character, adventure });
            const desktopPage = await desktop.newPage();
            await desktopPage.goto('http://127.0.0.1:8080/index.html', { waitUntil: 'networkidle' });
            await desktopPage.locator('.adventure-screen').waitFor();
            await desktopPage.screenshot({ path: 'artifacts/cosmopolis-desktop.png', fullPage: true });
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Upload rendered previews
        uses: actions/upload-artifact@v4
        with:
          name: cosmopolis-visual-preview
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
