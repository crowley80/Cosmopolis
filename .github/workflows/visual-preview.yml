            } catch (error) {
              const diagnostic = await page.evaluate(() => {
                const data = Save.load();
                const state = data && data.adventure && data.adventure.state || {};
                const people = state.characters || {};
                return {
                  actionCount: data && data.actions && data.actions.length,
                  inventory: state.inventory,
                  time: state.time,
                  day: state.day,
                  elia: people.Elia,
                  tomas: people.Tomás,
                  actionStatus: document.querySelector('#actionStatus')?.textContent || '',
                  story: document.querySelector('#storyContent')?.textContent || ''
                };
              });
              throw new Error('La segunda acción no produjo el estado esperado. Diagnóstico: ' + JSON.stringify(diagnostic) + '. Causa original: ' + error.message);
            }
            const liveMeta = await page.locator('.manuscript-meta').textContent();
            assert.ok(liveMeta.includes('Momento: Mediodía'), 'La cabecera debe actualizarse sin recargar: ' + liveMeta);
            await page.reload({ waitUntil: 'networkidle' });
            const reloadContinue = page.locator('.profile-section').filter({ hasText: 'Ariadna' }).locator('[data-load-save]');
            if (await reloadContinue.count()) await reloadContinue.click();
            await page.waitForFunction(() => {
              const story = document.querySelector('#storyContent');
              return story && story.textContent.trim().length > 0;
            });
            const restoredAction = await page.locator('#storyContent').textContent();
            const restoredMeta = await page.locator('.manuscript-meta').textContent();
            assert.ok(restoredAction.includes('Entrego el medallón de cobre a Elia.'), 'La última acción debe recuperarse tras recargar: ' + restoredAction);
            assert.ok(restoredMeta.includes('Momento: Mediodía'), 'El reloj interno debe recuperarse tras recargar: ' + restoredMeta);
            await page.locator('#openInventory').click();
            await page.locator('#toolOverlay').getByText('Athun — grimorio consciente').waitFor();
            await page.locator('#closeToolPanel').click();
            await page.locator('#openHistory').click();
            await page.locator('#toolOverlay').getByText('Entregas el medallón de cobre a Elia. Ella lo guarda con cuidado en su tubo de mapas.').waitFor();
            await page.locator('#closeToolPanel').click();

            console.log('INTERACTION_TESTS_OK: history, map, inventory add/remove, options, exploration, AI response, save and reload');

            const mobile = await page.evaluate(() => ({
              viewport: { width: innerWidth, height: innerHeight },
              document: { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight },
              paper: (() => { const r = document.querySelector('.adventure-screen').getBoundingClientRect(); return { x:r.x,y:r.y,width:r.width,height:r.height }; })(),
              header: (() => { const r = document.querySelector('.manuscript-header').getBoundingClientRect(); return { x:r.x,y:r.y,width:r.width,height:r.height }; })(),
              story: (() => { const r = document.querySelector('.story-panel').getBoundingClientRect(); return { x:r.x,y:r.y,width:r.width,height:r.height }; })(),
              player: (() => { const r = document.querySelector('.player-panel').getBoundingClientRect(); return { x:r.x,y:r.y,width:r.width,height:r.height }; })(),
              toolbar: (() => { const r = document.querySelector('.manuscript-toolbar').getBoundingClientRect(); return { x:r.x,y:r.y,width:r.width,height:r.height }; })()
            }));
            assert.ok(mobile.document.width <= mobile.viewport.width, 'La interfaz móvil no debe desbordarse horizontalmente');
            assert.ok(mobile.story.y + mobile.story.height <= mobile.player.y + 1, 'La narración no debe invadir el panel de escritura');
            assert.ok(mobile.player.y + mobile.player.height <= mobile.toolbar.y + 1, 'La escritura no debe invadir la barra inferior');
            console.log('MOBILE_LAYOUT', JSON.stringify(mobile));
            assert.ok(mobile.toolbar.y + mobile.toolbar.height <= mobile.viewport.height + 1, 'La barra inferior debe quedar dentro de la pantalla');
            await context.close();
            const desktop = await browser.newContext({ viewport: { width: 1024, height: 900 }, deviceScaleFactor: 1 });
            await desktop.addInitScript(({ character, adventure }) => {
              if (!localStorage.getItem('cosmopolis_save')) { localStorage.setItem('cosmopolis_save', JSON.stringify({ character, adventure, actions: [], world: { events: [], facts: [], relationships: {} } })); }
            }, { character, adventure });
            const desktopPage = await desktop.newPage();
            const desktopErrors = [];
            desktopPage.on('pageerror', error => desktopErrors.push(error.message));
            desktopPage.on('response', response => { if (response.status() === 404) console.error('RESOURCE_404_URL:', response.url()); });
            await desktopPage.goto('http://127.0.0.1:8080/index.html', { waitUntil: 'networkidle' });
            const desktopContinue = desktopPage.locator('[data-load-save]').first();
            if (await desktopContinue.count()) await desktopContinue.click();
            await desktopPage.locator('.adventure-screen').waitFor();
            const desktopWidth = await desktopPage.evaluate(() => ({ viewport: innerWidth, document: document.documentElement.scrollWidth }));
            assert.ok(desktopWidth.document <= desktopWidth.viewport, 'La interfaz de escritorio no debe desbordarse horizontalmente');
            assert.equal(desktopErrors.length, 0, 'No deben producirse errores JavaScript en escritorio: ' + desktopErrors.join('; '));
            await desktopPage.screenshot({ path: 'artifacts/cosmopolis-desktop.png', fullPage: true });

            // Comparación de pantallas secundarias en escritorio, con su desplazamiento interno real.
            await desktopPage.evaluate(() => Athun.showSaveSelection());
            await desktopPage.locator('[data-load-save]').waitFor();
            const secondaryDesktopMetrics = await desktopPage.evaluate(() => {
              const app = document.querySelector('#app');
              const scroll = app.querySelector('.secondary-scroll');
              const bodyStyle = getComputedStyle(document.body);
              const appStyle = getComputedStyle(app);
              return {
                viewport: { width: innerWidth, height: innerHeight },
                app: { x: app.getBoundingClientRect().x, width: app.getBoundingClientRect().width, height: app.getBoundingClientRect().height, backgroundSize: appStyle.backgroundSize, backgroundPosition: appStyle.backgroundPosition },
                body: { backgroundSize: bodyStyle.backgroundSize, backgroundPosition: bodyStyle.backgroundPosition },
                scroll: scroll ? { clientHeight: scroll.clientHeight, scrollHeight: scroll.scrollHeight, overflowY: getComputedStyle(scroll).overflowY } : null
              };
            });
            console.log('PARCHMENT_SECONDARY_DESKTOP', JSON.stringify(secondaryDesktopMetrics));
            await desktopPage.screenshot({ path: 'artifacts/athun-save-selection-desktop.png', fullPage: false });
            const desktopSecondaryScroll = await desktopPage.evaluate(() => {
              const scroll = document.querySelector('#app .secondary-scroll');
              if (!scroll) return { found: false };
              scroll.scrollTop = scroll.scrollHeight;
              return { found: true, scrollTop: scroll.scrollTop, maxScroll: scroll.scrollHeight - scroll.clientHeight };
            });
            console.log('PARCHMENT_SECONDARY_DESKTOP_BOTTOM', JSON.stringify(desktopSecondaryScroll));
            await desktopPage.screenshot({ path: 'artifacts/athun-save-selection-desktop-scroll-bottom.png', fullPage: false });

            // Diagnóstico: una sola capa de papiro, sin duplicación entre body y #app.
            const secondaryBackgroundTests = [
              { name: 'single-layer-stretch', size: '100% 100%', note: 'Una sola capa, ocupa la ventana completa' },
              { name: 'single-layer-natural-ratio', size: '100% auto', note: 'Una sola capa, conserva proporción original' }
            ];
            for (const variant of secondaryBackgroundTests) {
              await desktopPage.addStyleTag({ content: `
                body.athun-secondary-mode {
                  background-image:none !important;
                }
                body.athun-secondary-mode #app {
                  background-image:url('/app/assets/athun-papiro-universal.webp') !important;
                  background-size:${variant.size} !important;
                  background-position:center top !important;
                  background-repeat:no-repeat !important;
                }
              ` });
              await desktopPage.screenshot({ path: `artifacts/athun-save-selection-desktop-${variant.name}.png`, fullPage: false });
              const dimensions = await desktopPage.evaluate(() => ({
                viewport: { width: innerWidth, height: innerHeight },
                bodyImage: getComputedStyle(document.body).backgroundImage,
                app: { x: document.querySelector('#app').getBoundingClientRect().x, width: document.querySelector('#app').getBoundingClientRect().width, height: document.querySelector('#app').getBoundingClientRect().height, backgroundSize: getComputedStyle(document.querySelector('#app')).backgroundSize }
              }));
              console.log('PARCHMENT_SECONDARY_SINGLE_LAYER', variant.name, variant.note, JSON.stringify(dimensions));
              await desktopPage.evaluate(() => {
                const app = document.querySelector('#app');
                app.style.removeProperty('background-size');
              });
            }

            // Comparativa temporal de escalado del papiro en escritorio. Solo afecta a estas capturas.
            const parchmentVariants = [
              { name: 'height-fit', size: 'auto 100dvh', position: 'center top', note: 'Altura completa, proporción original y márgenes laterales' },
              { name: 'width-fit', size: '100% auto', position: 'center top', note: 'Ancho completo, proporción original y posible desplazamiento vertical' },
              { name: 'cover', size: 'cover', position: 'center center', note: 'Ventana cubierta, proporción original y recorte de papel' }
            ];
            for (const variant of parchmentVariants) {
              await desktopPage.addStyleTag({ content: `
                body,
              body #app {
                  background-size: ${variant.size} !important;
                  background-position: ${variant.position} !important;
                  background-color: #ead9b5 !important;
                }
              ` });
              await desktopPage.screenshot({ path: `artifacts/athun-desktop-parchment-${variant.name}.png`, fullPage: true });
              const dimensions = await desktopPage.evaluate(() => {
                const style = getComputedStyle(document.body);
                return { viewport: { width: innerWidth, height: innerHeight }, backgroundSize: style.backgroundSize, backgroundPosition: style.backgroundPosition };
              });
              console.log('PARCHMENT_DESKTOP_VARIANT', variant.name, variant.note, JSON.stringify(dimensions));
            }
            // La comparativa no modifica ningún archivo CSS ni la captura base de escritorio.

            // Regresión de interfaz: dos protagonistas, alternancia y aislamiento personal.
            const slotIds = await desktopPage.evaluate(() => {
              const ari = Save.list().find(entry => entry.name === 'Ariadna');
              if (!ari || !Save.activate(ari.id)) throw new Error('No se pudo preparar la partida de Ariadna');
              const ariSlot = Save.load();
              ariSlot.adventure.state.visitedLocations = ['Plaza del pozo'];
              ariSlot.adventure.state.athun = ariSlot.adventure.state.athun || {};
              ariSlot.adventure.state.athun.memories = ['Recuerdo privado del vínculo de Ariadna'];
              if (!Save.save(ariSlot)) throw new Error('No se pudo preparar el progreso personal de Ariadna');
              Save.addGlobalLocation('Plaza del pozo', 'Ariadna');
              const darian = Save.createSlot({
                name: 'Darian',
                nature: 'Humano',
                appearance: 'Viajero de ojos claros.',
                history: 'Procede del norte.',
                abilities: 'Orientación.',
                personality: 'Reservado.'
              }, {
                id: 'darian-adventure',
                title: 'La ruta del norte',
                location: 'Puerto de Bruma',
                text: 'Una historia distinta.',
                state: {
                  currentLocation: 'Puerto de Bruma',
                  inventory: ['Mapa antiguo'],
                  visitedLocations: ['Puerto de Bruma'],
                  visibleLocations: [],
                  characters: {},
                  athun: { memories: ['Recuerdo privado del vínculo de Darian'] }
                }
              }, {
                world: { facts: ['Recuerdo privado de Darian'], events: [], relationships: {} }
              });
              Save.addGlobalLocation('Puerto de Bruma', 'Darian');
              return { ari: ari && ari.id, darian, globalLocations: Save.getGlobalWorld().locations.map(entry => typeof entry === 'string' ? entry : entry.name) };
            });
            assert.ok(slotIds.ari && slotIds.darian, 'Deben existir dos partidas independientes');
            assert.ok(slotIds.globalLocations.includes('Plaza del pozo'), 'El mundo común debe conservar el lugar descubierto por Ariadna');

            await desktopPage.reload({ waitUntil: 'networkidle' });
            await desktopPage.locator('[data-load-save]').first().waitFor();
            assert.equal(await desktopPage.locator('[data-load-save]').count(), 2, 'El selector debe mostrar ambos protagonistas');
            await desktopPage.locator('[data-load-save="' + slotIds.ari + '"]').click();
            const ariState = await desktopPage.evaluate(() => Save.load());
            assert.equal(ariState.character.name, 'Ariadna', 'El selector debe abrir la partida elegida');
            assert.ok(!ariState.world.facts.includes('Recuerdo privado de Darian'), 'Los recuerdos personales de Darian no deben filtrarse a Ariadna');
            assert.ok(!ariState.adventure.state.athun.memories.includes('Recuerdo privado del vínculo de Darian'), 'Los recuerdos del vínculo de Athun deben permanecer en la partida de Darian');
            assert.ok(ariState.adventure.state.visitedLocations.includes('Plaza del pozo'), 'Ariadna debe conservar sus localizaciones personales');
            assert.ok(ariState.adventure.state.athun.memories.includes('Recuerdo privado del vínculo de Ariadna'), 'Ariadna debe conservar sus recuerdos propios de Athun');
            assert.ok(!ariState.adventure.state.visitedLocations.includes('Puerto de Bruma'), 'Las localizaciones visitadas por Darian no deben mezclarse con Ariadna');
            assert.ok(ariState.adventure.state.inventory.includes('Athun — grimorio consciente'), 'Ariadna debe conservar a Athun');
            assert.ok(slotIds.globalLocations.includes('Puerto de Bruma'), 'El mundo compartido debe incorporar también los descubrimientos de Darian');

            await desktopPage.locator('#openOptions').click();
            await desktopPage.locator('#toolOverlay #switchSaveFromOptions').click();
            await desktopPage.locator('[data-load-save="' + slotIds.darian + '"]').click();
            const darianState = await desktopPage.evaluate(() => Save.load());
            assert.equal(darianState.character.name, 'Darian', 'Debe poder alternarse al segundo protagonista');
            assert.ok(darianState.world.facts.includes('Recuerdo privado de Darian'), 'La segunda partida debe conservar sus recuerdos propios');
            assert.ok(!darianState.world.facts.includes('El personaje ha mostrado generosidad.'), 'El progreso personal de Ariadna no debe filtrarse a Darian');
            assert.ok(darianState.adventure.state.inventory.includes('Mapa antiguo'), 'Darian debe conservar su inventario independiente');
            assert.ok(darianState.adventure.state.visitedLocations.includes('Puerto de Bruma'), 'Darian debe conservar sus localizaciones personales');
            assert.ok(!darianState.adventure.state.visitedLocations.includes('Plaza del pozo'), 'Las localizaciones visitadas por Ariadna no deben mezclarse con Darian');
            assert.ok(darianState.adventure.state.athun.memories.includes('Recuerdo privado del vínculo de Darian'), 'Darian debe conservar sus recuerdos propios de Athun');
            assert.ok(!darianState.adventure.state.athun.memories.includes('Recuerdo privado del vínculo de Ariadna'), 'Los recuerdos de Athun de Ariadna no deben filtrarse a Darian');
            assert.ok(darianState.adventure.state.inventory.includes('Athun — grimorio consciente'), 'Athun debe existir también en la partida de Darian');
            const sharedAfterSwitch = Save.getGlobalWorld().locations.map(entry => typeof entry === 'string' ? entry : entry.name);
            assert.ok(sharedAfterSwitch.includes('Plaza del pozo') && sharedAfterSwitch.includes('Puerto de Bruma'), 'El mundo compartido debe conservar los descubrimientos de ambos protagonistas');

            // Comprueba que cada acceso inferior abre su pantalla correspondiente.
            const toolbarChecks = [
              ['#openHint', 'Una pista del grimorio'],
              ['#openHistory', 'Crónica de tus decisiones'],
              ['#openMap', 'Atlas y niebla de exploración'],
              ['#openInventory', 'Tus pertenencias'],
              ['#openOptions', 'Opciones de la partida']
            ];
            for (const [selector, expectedTitle] of toolbarChecks) {
              await desktopPage.locator(selector).click();
              await desktopPage.locator('#toolPanelTitle').waitFor();
              assert.equal(await desktopPage.locator('#toolPanelTitle').textContent(), expectedTitle, selector + ' debe abrir la pantalla correcta');
              await desktopPage.locator('#closeToolPanel').click();
              await desktopPage.locator('#toolOverlay').waitFor({ state: 'detached' });
            }

            // Accesibilidad de teclado: el foco queda dentro del diálogo, Escape lo cierra y lo devuelve al acceso de origen.
            await desktopPage.locator('#openOptions').click();
            await desktopPage.locator('#closeToolPanel').focus();
            await desktopPage.keyboard.press('Shift+Tab');
            assert.equal(await desktopPage.evaluate(() => document.activeElement.id), 'switchSaveFromOptions',
              'Mayús+Tab desde el primer control debe recorrer el foco al último control del diálogo');
            await desktopPage.keyboard.press('Escape');
            await desktopPage.locator('#toolOverlay').waitFor({ state: 'detached' });
            assert.equal(await desktopPage.evaluate(() => document.activeElement.id), 'openOptions',
              'Escape debe devolver el foco al botón que abrió el diálogo');

            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Upload rendered previews (also when a later assertion fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmopolis-visual-preview
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
