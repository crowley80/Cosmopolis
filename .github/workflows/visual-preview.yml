name: Visual preview
on:
  push:
    branches: [main, work/athun-papiro-universal-20261122]
    paths:
      - 'app/**'
      - 'index.html'
      - 'server.js'
      - '.github/workflows/visual-preview.yml'
  pull_request:
    branches: [main, integration/athun-multisave-main-20261116]
    paths:
      - 'app/**'
      - 'index.html'
      - '.github/workflows/visual-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          node server.js > /tmp/athun-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ | grep -q '<title>Athun: el grimorio oscuro</title>'; then exit 0; fi
            sleep 1
          done
          cat /tmp/athun-http.log
          exit 1
      - name: Render adventure on mobile and desktop
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const character = {
              name: 'Ariadna',
              nature: 'Humana',
              appearance: 'Viajera de cabello oscuro y ojos atentos.',
              history: 'Cartógrafa en busca de lugares olvidados.',
              abilities: 'Observación y orientación.',
              personality: 'Curiosa y prudente.'
            };
            const adventure = {
              id: 'preview',
              title: 'La campana bajo la montaña',
              location: 'Valdebruma',
              text: 'El camino desciende entre montañas cubiertas de niebla. Al final aparece Valdebruma, un pueblo de tejados oscuros, chimeneas humeantes y calles empedradas.\n\nAriadna, llevas poco tiempo en el pueblo cuando escuchas una campanada. Es profunda, lenta y parece subir desde debajo de tus pies.\n\nLa gente se detiene. Nadie mira hacia el campanario de la plaza. Todos miran hacia el viejo pozo de piedra, cerrado con una losa y varias cadenas oxidadas.\n\nUna mujer se abre paso entre los vecinos. Lleva un tubo de mapas colgado al hombro y tiene barro hasta las rodillas.\n\n—Me llamo Elia. Soy cartógrafa —dice, sin apartar los ojos del pozo—. Esa campana lleva treinta años sin existir. Y, sin embargo, acaba de sonar por tercera vez esta semana.\n\nSe vuelve hacia ti.\n\n—No te conozco, pero pareces alguien capaz de escuchar antes de salir corriendo. Necesito ayuda.\n\nElia espera tu respuesta.',
              state: { currentLocation: 'Plaza del pozo', time: 'Mañana', characters: { Elia: { role: 'Cartógrafa', location: 'Plaza del pozo', attitude: 'Cautelosa', personalGoal: 'Averiguar por qué suenan las campanas.', goalHistory: [], trust: 0 } } },
              createdAt: new Date().toISOString()
            };
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1, isMobile: true, hasTouch: true });
            await context.addInitScript(({ character, adventure }) => {
              if (!localStorage.getItem('cosmopolis_save')) { localStorage.setItem('cosmopolis_save', JSON.stringify({ character, adventure, actions: [], world: { events: [], facts: [], relationships: {} } })); }
            }, { character, adventure });
            const page = await context.newPage();
            page.on('pageerror', error => console.error('PAGE ERROR:', error.message));
            await page.goto('http://127.0.0.1:8080/index.html', { waitUntil: 'networkidle' });
            const continueSave = page.locator('[data-load-save]').first();
            if (await continueSave.count()) await continueSave.click();
            const assert = require('node:assert/strict');
            await page.locator('.adventure-screen').waitFor();

            // Capturas de las pantallas auxiliares sobre el papiro en blanco.
            const secondaryContext = await browser.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1, isMobile: true, hasTouch: true });
            const secondaryPage = await secondaryContext.newPage();
            const secondaryErrors = [];
            secondaryPage.on('pageerror', error => secondaryErrors.push(error.message));
            await secondaryPage.goto('http://127.0.0.1:8080/index.html', { waitUntil: 'networkidle' });
            await secondaryPage.locator('#continueFromPrologue').waitFor();
            const prologueBackground = await secondaryPage.evaluate(() => ({
              image: getComputedStyle(document.querySelector('#app')).backgroundImage,
              parchment: getComputedStyle(document.querySelector('.secondary-scroll > .character-creation')).backgroundColor
            }));
            assert.ok(prologueBackground.image.includes('athun-papiro-universal.webp'), 'El prólogo debe usar el papiro universal en blanco');
            assert.equal(prologueBackground.parchment, 'rgba(0, 0, 0, 0)', 'El prólogo no debe quedar dentro de un rectángulo opaco');
            await secondaryPage.screenshot({ path: 'artifacts/athun-prologue-mobile.png', fullPage: true });
            await secondaryPage.locator('#continueFromPrologue').click();
            await secondaryPage.locator('#characterForm').waitFor();
            const characterScreenStyles = await secondaryPage.locator('.character-creation, #characterForm fieldset').evaluateAll(nodes => nodes.map(node => {
              const style = getComputedStyle(node);
              return { background: style.backgroundColor, image: style.backgroundImage, shadow: style.boxShadow };
            }));
            assert.ok(characterScreenStyles.every(style => style.background === 'rgba(0, 0, 0, 0)' && style.image === 'none' && style.shadow === 'none'), 'La creación de personaje debe escribirse directamente sobre el papiro');
            const characterFieldStyles = await secondaryPage.locator('#characterForm input, #characterForm textarea, #characterForm select').evaluateAll(nodes => nodes.map(node => {
              const style = getComputedStyle(node);
              return {
                background: style.backgroundColor,
                top: style.borderTopWidth,
                right: style.borderRightWidth,
                bottom: style.borderBottomWidth,
                left: style.borderLeftWidth,
                shadow: style.boxShadow,
                color: style.color
              };
            }));
            assert.ok(characterFieldStyles.length > 0 && characterFieldStyles.every(style =>
              style.background === 'rgba(0, 0, 0, 0)' &&
              style.top === '0px' && style.right === '0px' && style.left === '0px' &&
              style.shadow === 'none' && style.color === 'rgb(113, 59, 50)'
            ), 'Los campos de creación deben quedar integrados en el papiro, sin recuadros y con escritura granate: ' + JSON.stringify(characterFieldStyles));
            await secondaryPage.screenshot({ path: 'artifacts/athun-character-creation-mobile.png', fullPage: true });
            await secondaryPage.locator('#characterForm input[name="name"]').fill('Prueba visual');
            await secondaryPage.locator('.secondary-actions button[form="characterForm"][type="submit"]').click();
            await secondaryPage.locator('#startAdventure').waitFor();
            const profileScreenStyles = await secondaryPage.locator('.character-creation, .profile-section').evaluateAll(nodes => nodes.map(node => {
              const style = getComputedStyle(node);
              return { background: style.backgroundColor, image: style.backgroundImage, shadow: style.boxShadow };
            }));
            assert.ok(profileScreenStyles.every(style => style.background === 'rgba(0, 0, 0, 0)' && style.image === 'none' && style.shadow === 'none'), 'La ficha debe mostrar sus textos sin tarjetas de fondo');
            await secondaryPage.screenshot({ path: 'artifacts/athun-profile-mobile.png', fullPage: true });
            // Diagnóstico de continuidad del papiro al desplazarse en la ficha móvil.
            const parchmentScroll = await secondaryPage.evaluate(() => {
              const app = document.querySelector('#app');
              const candidates = [document.scrollingElement, document.body, app, ...document.querySelectorAll('.secondary-scroll, main, .screen-content')].filter(Boolean);
              const scrollables = [...new Set(candidates)].map(el => ({
                tag: el.tagName, className: typeof el.className === 'string' ? el.className : '',
                clientHeight: el.clientHeight, scrollHeight: el.scrollHeight,
                overflowY: getComputedStyle(el).overflowY
              })).filter(el => el.scrollHeight > el.clientHeight + 2);
              const bodyStyle = getComputedStyle(document.body);
              const appStyle = getComputedStyle(app);
              return {
                viewport: { width: innerWidth, height: innerHeight },
                document: { clientHeight: document.documentElement.clientHeight, scrollHeight: document.documentElement.scrollHeight },
                body: { height: document.body.getBoundingClientRect().height, backgroundSize: bodyStyle.backgroundSize, backgroundPosition: bodyStyle.backgroundPosition, backgroundAttachment: bodyStyle.backgroundAttachment },
                app: { height: app.getBoundingClientRect().height, scrollHeight: app.scrollHeight, backgroundSize: appStyle.backgroundSize },
                scrollables
              };
            });
            console.log('PARCHMENT_MOBILE_SCROLL', JSON.stringify(parchmentScroll));
            const scrollResult = await secondaryPage.evaluate(() => {
              const candidates = [document.scrollingElement, document.body, document.querySelector('#app'), ...document.querySelectorAll('.secondary-scroll, main, .screen-content')].filter(Boolean);
              const target = candidates.find(el => el.scrollHeight > el.clientHeight + 2);
              if (!target) return { found: false };
              target.scrollTop = target.scrollHeight;
              return { found: true, className: target.className, scrollTop: target.scrollTop, maxScroll: target.scrollHeight - target.clientHeight };
            });
            assert.ok(scrollResult.found && scrollResult.scrollTop > 0, 'La ficha secundaria debe permitir desplazarse dentro de su contenido');
            console.log('PARCHMENT_MOBILE_SCROLL_BOTTOM', JSON.stringify(scrollResult));
            await secondaryPage.waitForTimeout(150);
            await secondaryPage.screenshot({ path: 'artifacts/athun-profile-mobile-scroll-bottom.png', fullPage: false });
            await secondaryPage.evaluate(() => {
              const target = document.querySelector('.secondary-scroll');
              if (target) target.scrollTop = 0;
              window.scrollTo(0, 0);
            });
            await secondaryPage.evaluate(() => Athun.showSaveSelection());
            await secondaryPage.locator('[data-load-save]').waitFor();
            const saveScreenStyles = await secondaryPage.locator('.character-creation, .profile-section').evaluateAll(nodes => nodes.map(node => {
              const style = getComputedStyle(node);
              return { background: style.backgroundColor, image: style.backgroundImage, shadow: style.boxShadow };
            }));
            assert.ok(saveScreenStyles.every(style => style.background === 'rgba(0, 0, 0, 0)' && style.image === 'none' && style.shadow === 'none'), 'La selección de partidas debe evitar cajas artificiales');
            await secondaryPage.screenshot({ path: 'artifacts/athun-save-selection-mobile.png', fullPage: true });
            assert.equal(secondaryErrors.length, 0, 'Las pantallas auxiliares no deben producir errores JavaScript: ' + secondaryErrors.join('; '));
            await secondaryContext.close();

            // Regresión de composición: un único campo de acción y cinco accesos, sin adornos duplicados.
            const toolbarButtons = page.locator('.manuscript-toolbar .toolbar-button');
            assert.equal(await toolbarButtons.count(), 5, 'La barra inferior debe contener exactamente cinco accesos');
            assert.equal(await page.locator('.manuscript-toolbar .toolbar-divider:visible').count(), 0, 'Los separadores no deben ocupar espacio ni crear una segunda fila');
            assert.equal(await page.locator('.player-panel textarea').count(), 1, 'Debe existir un único campo de acción');
            assert.equal(await page.locator('.player-panel form > button[type="submit"]').count(), 1, 'Debe existir un único botón Enviar');
            assert.equal(await page.locator('.player-panel .quill-inkwell:visible').count(), 0, 'La pluma decorativa no debe invadir el formulario compacto');

            const overlayMetrics = await page.evaluate(() => {
              const rect = element => { const r = element.getBoundingClientRect(); return { x:r.x, right:r.right, y:r.y, bottom:r.bottom, width:r.width, height:r.height }; };
              const style = element => getComputedStyle(element);
              const title = document.querySelector('.wordmark h1');
              const meta = document.querySelector('.manuscript-meta');
              const story = document.querySelector('.story-panel');
              const player = document.querySelector('.player-panel');
              const input = document.querySelector('#playerAction');
              const send = document.querySelector('.player-panel form > button[type="submit"]');
              const toolbarIcon = document.querySelector('.manuscript-toolbar .toolbar-button svg');
              const toolbarLabel = document.querySelector('.manuscript-toolbar .toolbar-button > span:last-child');
              return {
                title:rect(title), meta:rect(meta), story:rect(story), player:rect(player), input:rect(input),
                inputBackground:style(input).backgroundColor, inputBorder:style(input).borderTopWidth,
                sendFontSize:style(send).fontSize, sendBackground:style(send).backgroundColor,
                toolbarIconOpacity:style(toolbarIcon).opacity, toolbarLabelPosition:style(toolbarLabel).position,
                toolbarLabelFontSize:style(toolbarLabel).fontSize, toolbarButtonFontSize:style(document.querySelector('.manuscript-toolbar .toolbar-button')).fontSize,
                hintLabelFontSize:getComputedStyle(document.querySelector('#openHint'),'::after').fontSize,
                storyOverflow:style(story).overflowY
              };
            });
            assert.ok(overlayMetrics.title.y + overlayMetrics.title.height <= overlayMetrics.meta.y + 2, 'El título y los metadatos no deben solaparse verticalmente');
            const visualPalette = await page.evaluate(() => ({
              parchment: getComputedStyle(document.body).backgroundImage,
              heading: getComputedStyle(document.querySelector('.wordmark h1')).color,
              narrative: getComputedStyle(document.querySelector('.story-content')).color,
              adventureBackground: getComputedStyle(document.querySelector('.adventure-screen')).backgroundImage
            }));
            assert.ok(visualPalette.parchment.includes('athun-papiro-universal.webp'), 'El narrador debe usar el papiro universal en blanco');
            assert.equal(visualPalette.heading, 'rgb(113, 59, 50)', 'Los títulos deben usar el granate aprobado');
            assert.equal(visualPalette.narrative, 'rgb(113, 59, 50)', 'La narración debe usar el granate aprobado');
            const hintLabelColor = await page.locator('#openHint').evaluate(el => getComputedStyle(el, '::after').color);
            assert.equal(hintLabelColor, 'rgb(113, 59, 50)', 'La etiqueta Pista debe usar el granate aprobado');
            assert.equal(visualPalette.adventureBackground, 'none', 'El papiro debe pintarse una sola vez, sin fondo duplicado');

            // Regresión específica: la acción actual también debe quedar escrita directamente sobre el papiro.
            const currentActionStyle = await page.evaluate(() => {
              const probe = document.createElement('p');
              probe.className = 'current-action';
              probe.textContent = 'Acción de comprobación visual';
              document.querySelector('.adventure-screen').appendChild(probe);
              const style = getComputedStyle(probe);
              const result = {
                background: style.backgroundColor,
                backgroundImage: style.backgroundImage,
                border: style.borderTopWidth,
                borderLeft: style.borderLeftWidth,
                outline: style.outlineStyle,
                shadow: style.boxShadow
              };
              probe.remove();
              return result;
            });
            assert.ok(
              currentActionStyle.background === 'rgba(0, 0, 0, 0)' &&
              currentActionStyle.backgroundImage === 'none' &&
              currentActionStyle.border === '0px' &&
              currentActionStyle.borderLeft === '0px' &&
              currentActionStyle.outline === 'none' &&
              currentActionStyle.shadow === 'none',
              'La acción actual no debe conservar ningún recuadro: ' + JSON.stringify(currentActionStyle)
            );
            assert.equal(overlayMetrics.inputBackground, 'rgba(0, 0, 0, 0)', 'El campo debe quedar integrado directamente en el papiro');
            assert.equal(overlayMetrics.inputBorder, '0px', 'El campo no debe mostrar marco ni borde');
            assert.notEqual(overlayMetrics.sendFontSize, '0px', 'El botón Enviar debe mostrar su etiqueta');
            assert.equal(overlayMetrics.sendBackground, 'rgba(0, 0, 0, 0)', 'El botón Enviar no debe formar una caja coloreada');
            assert.equal(overlayMetrics.toolbarIconOpacity, '1', 'Los iconos de los cinco accesos deben ser visibles');
            assert.equal(overlayMetrics.toolbarLabelPosition, 'static', 'Las etiquetas de los cinco accesos deben estar visibles');
            assert.ok(parseFloat(overlayMetrics.toolbarLabelFontSize) >= 10 && parseFloat(overlayMetrics.toolbarButtonFontSize) >= 10 && parseFloat(overlayMetrics.hintLabelFontSize) >= 10, 'Las etiquetas de los cinco accesos deben tener al menos 10 px para leerse en móvil');
            assert.equal(overlayMetrics.storyOverflow, 'auto', 'La narración debe desplazarse dentro de su área');
            assert.ok(overlayMetrics.input.x >= overlayMetrics.player.x - 1 && overlayMetrics.input.right <= overlayMetrics.player.right + 1, 'El campo del jugador debe quedar dentro de su panel');

            // La escritura de paneles auxiliares debe integrarse en el papiro, sin cajas coloreadas.
            await page.evaluate(() => {
              const probe = document.createElement('article');
              probe.className = 'tool-entry';
              document.querySelector('.adventure-screen').appendChild(probe);
              const panel = document.createElement('div');
              panel.className = 'tool-panel';
              document.querySelector('.adventure-screen').appendChild(panel);
              const styles = [getComputedStyle(probe), getComputedStyle(panel)];
              const transparent = value => value === 'rgba(0, 0, 0, 0)' || value === 'transparent';
              if (styles.some(style => !transparent(style.backgroundColor) || style.backgroundImage !== 'none' || style.boxShadow !== 'none')) throw new Error('Los textos auxiliares aún tienen un fondo artificial');
              probe.remove(); panel.remove();
            });

            // Pista debe abrir su propio panel; el cierre no espera a la respuesta asíncrona.
            const hintLabelStyle = await page.locator('#openHint').evaluate(node => {
              const style = getComputedStyle(node, '::after');
              const rect = node.getBoundingClientRect();
              return { content: style.content, display: style.display, visibility: style.visibility, color: style.color, width: rect.width, height: rect.height };
            });
            assert.ok(hintLabelStyle.content.includes('Pista') && hintLabelStyle.display !== 'none' && hintLabelStyle.visibility !== 'hidden' && hintLabelStyle.width >= 30 && hintLabelStyle.height >= 10 && hintLabelStyle.color !== 'rgba(0, 0, 0, 0)', 'La etiqueta Pista debe verse en la barra inferior: ' + JSON.stringify(hintLabelStyle));
            await page.locator('#openHint').click();
            await page.locator('#toolPanelTitle').waitFor();
            assert.equal((await page.locator('#toolPanelTitle').innerText()).trim(), 'Una pista del grimorio', 'Pista debe abrir su panel correspondiente');
            const hintStyles = await page.locator('.tool-panel, .tool-panel-heading, .tool-panel-content').evaluateAll(nodes => nodes.map(node => {
              const style = getComputedStyle(node);
              return { background: style.backgroundColor, image: style.backgroundImage, border: style.borderTopWidth, shadow: style.boxShadow };
            }));
            if (hintStyles.some(style => style.background !== 'rgba(0, 0, 0, 0)' || style.image !== 'none' || style.border !== '0px' || style.shadow !== 'none')) {
              throw new Error('El panel de Pista conserva una caja visual sobre el papiro');
            }
            await page.locator('#closeToolPanel').click();

            // El mapa conserva su dibujo, pero la información textual no debe aparecer en tarjetas.
            await page.locator('#openMap').click();
            await page.locator('.atlas-map').waitFor();
            if (await page.locator('.atlas-map-node').count() < 1) throw new Error('El mapa no representa la ubicación actual');
            const atlasTextStyles = await page.locator('.tool-overlay, .tool-panel, .tool-panel-heading, .atlas-place, .atlas-frontier').evaluateAll(nodes => nodes.map(node => {
              const style = getComputedStyle(node);
              return { background: style.backgroundColor, image: style.backgroundImage, border: style.borderTopWidth, shadow: style.boxShadow };
            }));
            if (atlasTextStyles.some(style => style.background !== 'rgba(0, 0, 0, 0)' || style.image !== 'none' || style.border !== '0px' || style.shadow !== 'none')) {
              throw new Error('El atlas conserva cajas de fondo alrededor de los textos');
            }
            await page.locator('#closeToolPanel').click();

            // Cada acceso debe abrir su panel correcto, no el de otro botón.
            for (const [button, expected] of [
              ['#openHistory', 'Crónica de tus decisiones'],
              ['#openInventory', 'Tus pertenencias'],
              ['#openOptions', 'Opciones de la partida']
            ]) {
              await page.locator(button).click();
              await page.locator('#toolPanelTitle').waitFor();
              assert.equal((await page.locator('#toolPanelTitle').innerText()).trim(), expected, button + ' debe abrir ' + expected);
              const panelStyles = await page.locator('.tool-overlay, .tool-panel, .tool-panel-heading, .tool-panel-content').evaluateAll(nodes => nodes.map(node => {
                const style = getComputedStyle(node);
                return { background: style.backgroundColor, image: style.backgroundImage, border: style.borderTopWidth, shadow: style.boxShadow };
              }));
              assert.ok(panelStyles.every(style => style.background === 'rgba(0, 0, 0, 0)' && style.image === 'none' && style.border === '0px' && style.shadow === 'none'), button + ' debe mostrar texto sin caja visual');
              if (button === '#openInventory') {
                assert.ok(await page.locator('#toolOverlay').getByText('Athun — grimorio consciente').count(), 'El inventario debe mostrar Athun');
              }
              if (button === '#openOptions') {
                await page.locator('#saveNow').click();
                assert.match(await page.locator('#toolFeedback').innerText(), /guardado correctamente/, 'Guardar ahora debe confirmar el guardado');
                await page.locator('#profileFromOptions').click();
                await page.locator('#startAdventure').waitFor();
                assert.equal((await page.locator('.character-creation h2').first().innerText()).trim(), 'Ariadna', 'Consultar mi ficha debe abrir la ficha del protagonista');
                await page.evaluate(() => Athun.showAdventure(Save.load().character, Save.load().adventure));
              } else {
                await page.locator('#closeToolPanel').click();
              }
            }

            // Cambiar de partida desde Opciones debe abrir el selector y activar el guardado elegido.
            const optionSwitchIds = await page.evaluate(() => {
              const firstId = Save.getActiveId();
              const secondCharacter = {
                name: 'Bruno', nature: 'Humano', appearance: 'Personaje de prueba',
                history: 'Ficha aislada de prueba', abilities: 'Ninguna', personality: 'Sereno'
              };
              const secondAdventure = {
                id: 'preview-second', title: 'Partida aislada de prueba',
                location: 'Punto de partida de Bruno',
                text: 'Esta partida de prueba debe permanecer separada.',
                state: { currentLocation: 'Punto de partida de Bruno', inventory: [] }
              };
              const secondId = Save.createSlot(secondCharacter, secondAdventure, {
                actions: [{ text: 'Acción exclusiva de Bruno', response: 'Respuesta de Bruno' }]
              });
              if (!secondId || !Save.activate(firstId)) throw new Error('No se pudieron preparar dos partidas independientes');
              return { firstId, secondId };
            });
            await page.locator('#openOptions').click();
            await page.locator('#switchSaveFromOptions').click();
            await page.getByRole('heading', { name: 'Tus partidas' }).waitFor();
            assert.equal(await page.locator('[data-load-save]').count(), 2, 'El selector debe mostrar las dos partidas');
            await page.locator('.profile-section').filter({ hasText: 'Bruno' }).locator('[data-load-save]').click();
            await page.locator('.adventure-screen').waitFor();
            const switched = await page.evaluate(() => ({
              character: Save.load().character.name,
              action: Save.load().actions[0].text,
              active: Save.getActiveId()
            }));
            assert.equal(switched.character, 'Bruno', 'Cambiar de partida debe activar el personaje elegido');
            assert.equal(switched.action, 'Acción exclusiva de Bruno', 'El historial debe pertenecer a la partida elegida');
            assert.equal(switched.active, optionSwitchIds.secondId, 'El identificador activo debe corresponder a Bruno');
            await page.evaluate(() => {
              const ari = Save.list().find(item => item.name === 'Ariadna');
              if (!ari || !Save.activate(ari.id)) throw new Error('No se pudo restaurar la partida de Ariadna para las pruebas siguientes');
              const saved = Save.load();
              Athun.showAdventure(saved.character, saved.adventure);
            });
            await page.locator('.adventure-screen').waitFor();

            // Regresión narrativa: apertura aprobada, descubrimientos graduales y Athun permanente.
            await page.evaluate(async () => {
              const player = { name: 'Ariadna' };
              const opening = Adventure.createOpening(player);
              const fail = message => { throw new Error('NARRATIVE REGRESSION: ' + message); };
              if (opening.location !== 'Camino de entrada a Valdebruma') fail('ubicación inicial incorrecta');
              if (opening.state.phase !== 'arrival') fail('fase inicial incorrecta');
              if (!opening.text.startsWith('El camino lleva un buen rato descendiendo entre las montañas.')) fail('texto de apertura incorrecto');
              if (!opening.text.endsWith('Tu historia en Valdebruma comienza aquí.')) fail('cierre de apertura incorrecto');
              if (opening.state.eliaMet !== false || opening.state.characters.Elia) fail('Elia aparece antes de ser conocida');
              if (opening.state.wellDiscovered || opening.state.bellDiscovered || opening.state.bellRings !== 0) fail('el pozo o la campana se revelan prematuramente');
              if (!opening.state.inventory.some(item => String(item).toLowerCase().includes('athun'))) fail('Athun no está en el inventario inicial');
              if (!opening.state.athun || opening.state.athun.permanent !== true) fail('Athun no está protegido como pertenencia permanente');

              const previousStorage = Array.from({ length: localStorage.length }, (_, index) => {
                const key = localStorage.key(index);
                return [key, localStorage.getItem(key)];
              });
              try {
                localStorage.clear();
                const legacyRaw = JSON.stringify({ adventure: { state: { inventory: [] } }, actions: [] });
                localStorage.setItem(Save.key, legacyRaw);
