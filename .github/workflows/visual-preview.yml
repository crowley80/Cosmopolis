                if (!migratedAgain.adventure.state.inventory.some(item => String(item).toLowerCase().includes('athun'))) fail('la migración no es estable al cargar de nuevo');
                if (localStorage.getItem(migratedKey) !== beforeSecondLoad) fail('la segunda carga vuelve a escribir la partida migrada');
